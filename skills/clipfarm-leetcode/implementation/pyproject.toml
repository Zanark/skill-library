[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clipfarm"
version = "0.1.0"
description = "A local-first studio for captioned vertical clips and reviewed horizontal solution videos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "imageio-ffmpeg>=0.6,<1",
  "opencv-python>=4.11,<5",
  "numpy>=2.1,<3",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.2,<2"]
workflow = ["rapidocr>=3.9,<4", "onnxruntime>=1.20,<2", "faster-whisper>=1.2,<2"]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "playwright>=1.50,<2"]

[project.scripts]
clipfarm = "clipfarm.__main__:main"

[tool.setuptools.packages.find]
include = ["clipfarm*"]

[tool.setuptools.package-data]
clipfarm = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
