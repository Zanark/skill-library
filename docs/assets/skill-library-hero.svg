  <path d="M495 54a105 105 0 0 1 210 0v172H495z" fill="#111b2b" stroke="#b48355" stroke-width="9"/>
  <path d="M512 65a88 88 0 0 1 176 0v144H512z" fill="#294766"/>
  <circle cx="637" cy="94" r="34" fill="#f5d8a0" opacity=".92"/>
  <path d="M512 162c44-32 76-12 105-35 28-22 46-9 71-35v117H512z" fill="#14283e"/>
  <path d="M600 20v189M512 126h176" stroke="#b48355" stroke-width="6"/>

