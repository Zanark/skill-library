<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">The Skill Library</title>
  <desc id="desc">A warm illustrated library with wooden shelves, a rolling ladder, a reading desk, and rows of books.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172238"/>
      <stop offset="1" stop-color="#28324a"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5a32"/>
      <stop offset=".5" stop-color="#5f3822"/>
      <stop offset="1" stop-color="#3d2419"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#523424"/>
      <stop offset="1" stop-color="#241914"/>
    </linearGradient>
    <radialGradient id="lampGlow">
      <stop offset="0" stop-color="#ffd98a" stop-opacity=".54"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#130c08" flood-opacity=".6"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#wall)"/>
  <rect y="350" width="1200" height="70" fill="url(#floor)"/>
  <path d="M0 372H1200M70 350v70M235 350v70M420 350v70M635 350v70M870 350v70M1080 350v70" stroke="#9b6741" stroke-opacity=".25" stroke-width="2"/>

