  <!-- brass plaque -->
  <g transform="translate(510 224)" filter="url(#shadow)">
    <rect width="180" height="38" rx="6" fill="#b88b48" stroke="#f0cd7d" stroke-width="2"/>
    <text x="90" y="25" fill="#2e2116" font-family="Georgia, serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="2">SKILL LIBRARY</text>
