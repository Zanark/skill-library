<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Skill Library</title>
  <desc id="desc">A minimal banner with an organized collection of modular skill cards.</desc>
  <defs>
